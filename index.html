<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>i-QC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sidebar + content on desktop; top bar + bottom tab bar on phone. Process colors borrow the four print inks (cyan, magenta, yellow, key). */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#E4E9ED; --line:#D0D7DE;
  --fg:#12233A; --fg-2:#46555F; --fg-3:#6F7E89;
  --accent:#0A58D0; --accent-fg:#FFFFFF; --accent-soft:#DCE8FD; --logo-l:block; --logo-d:none; --logo-hw:block; --logo-hn:none; --tabstrip:color-mix(in srgb,var(--accent) 15%,var(--bg));
  --ok:#1B7A4B; --ok-bg:#DAF0E3; --ng:#BE2F29; --ng-bg:#F8DEDB; --hold:#935400; --hold-bg:#FAEAC8;
  --ink-c:#0F8FB0; --ink-m:#BD2E78; --ink-y:#C99700; --ink-k:#2A3138;
  --scrim:rgba(8,14,20,.55);
  --f-display:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151B; --surface:#16202A; --surface-2:#1E2A35; --line:#2C3A47;
    --fg:#E7EDF1; --fg-2:#A9B6C1; --fg-3:#7E8D99;
    --accent:#6FA3FF; --accent-fg:#0A1430; --accent-soft:#172C52; --logo-l:none; --logo-d:block; --logo-hw:none; --logo-hn:block; --tabstrip:color-mix(in srgb,var(--accent) 10%,#05080B);
    --ok:#5FCF95; --ok-bg:#15392A; --ng:#FF8E85; --ng-bg:#46201E; --hold:#F3B756; --hold-bg:#40311A;
    --ink-c:#4DC3E2; --ink-m:#EE77B0; --ink-y:#F1C53F; --ink-k:#B3BDC6;
    --scrim:rgba(0,0,0,.65); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#16202A; --surface-2:#1E2A35; --line:#2C3A47;
  --fg:#E7EDF1; --fg-2:#A9B6C1; --fg-3:#7E8D99;
  --accent:#6FA3FF; --accent-fg:#0A1430; --accent-soft:#172C52; --logo-l:none; --logo-d:block; --logo-hw:none; --logo-hn:block; --tabstrip:color-mix(in srgb,var(--accent) 10%,#05080B);
  --ok:#5FCF95; --ok-bg:#15392A; --ng:#FF8E85; --ng-bg:#46201E; --hold:#F3B756; --hold-bg:#40311A;
  --ink-c:#4DC3E2; --ink-m:#EE77B0; --ink-y:#F1C53F; --ink-k:#B3BDC6;
  --scrim:rgba(0,0,0,.65); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);margin:0;min-height:100dvh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:30px;line-height:1.1;font-weight:700}
h2{font-size:20px;line-height:1.2}
h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);font-weight:600}

/* process color per group */
.g-printing{--pc:var(--ink-m)} .g-laminasi{--pc:var(--ink-c)} .g-slitting{--pc:var(--ink-y)} .g-bag{--pc:var(--ink-k)}
.pdot{width:10px;height:10px;border-radius:50%;background:var(--pc);flex:none;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line)}

/* shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:24px;padding-block:22px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.01em}
.brand svg{width:28px;height:28px;color:var(--accent)}
.brand .logo{display:block;height:34px;width:auto}
.brand .logo-l{display:var(--logo-l)}.brand .logo-d{display:var(--logo-d)}.brand .logo-w,.brand .logo-n{display:none}
.top .brand .logo{height:26px}
.side .brand{padding:4px 4px 8px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;padding:11px 12px;border-radius:8px;color:var(--fg-2);text-align:left;font-weight:500;min-height:44px}
.nav button svg{width:20px;height:20px;flex:none}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .badge{margin-left:auto;font-size:12px;font-family:var(--f-mono);background:var(--hold-bg);color:var(--hold);border-radius:99px;padding:1px 8px}
.me{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
.me b{display:block;font-weight:600}
.col{min-width:0;display:flex;flex-direction:column}
.top{display:none}
.main{padding-block:28px 56px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));width:100%;max-width:none;display:flex;flex-direction:column;gap:24px;min-width:0}
.tabbar{display:none}
.pagehead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.pagehead .sub{margin-top:4px;color:var(--fg-2)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--ng);border-color:var(--ng)}
.btn.pri.saved{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.btn.pri.saved:hover{filter:none;background:var(--ok-bg)}
.hl{flex:none;--X:var(--accent);--Xbg:var(--accent-soft);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:0 1px 2px rgba(15,23,42,.05)}
.hl.hold{--X:var(--hold);--Xbg:var(--hold-bg)} .hl.ng{--X:var(--ng);--Xbg:var(--ng-bg)} .hl.ok{--X:var(--ok);--Xbg:var(--ok-bg)} .hl.info{--X:var(--accent);--Xbg:var(--accent-soft)}
.hl .hlh{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--Xbg);border-bottom:1px solid color-mix(in srgb,var(--X) 28%,transparent)}
.hl .hli{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--X);color:var(--surface);flex:none}
.hl .hli svg{width:20px;height:20px}
.hl .hlt{flex:1;min-width:0}
.hl h3{margin:0;color:var(--fg);font-size:16px}
.hl .hlsub{font-size:13px;color:var(--fg-2);margin:2px 0 0}
.hl .hlb{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.hl .hlview{padding-left:12px;border-left:3px solid var(--X)}
.hl .memobody{font-size:16.5px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.hl form{margin-top:14px!important;padding-top:14px;border-top:1px dashed var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.ghost{background:none;border-color:transparent;color:var(--fg-2)}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.fld>.lbl{font-size:13px;font-weight:600;color:var(--fg-2)}
.in{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);min-width:0}
textarea.in{min-height:84px;resize:vertical}
select.in{appearance:auto}
.in::placeholder{color:var(--fg-3)}
.req{color:var(--ng)}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pad{padding:18px 20px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.ng{background:var(--ng-bg);color:var(--ng)}
.chip.hold{background:var(--hold-bg);color:var(--hold)}
.chip.mute{background:var(--surface-2);color:var(--fg-3);font-weight:500}
.chip.info{background:var(--accent-soft);color:var(--accent)}

/* auth */
.auth{min-height:100dvh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.authcard{width:min(420px,100%);display:flex;flex-direction:column;gap:20px}
.authcard .brand{font-size:28px}
.authcard .brand .logo{height:42px}
.auth2{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.authhero{background:var(--accent);color:var(--accent-fg);padding:48px clamp(28px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;gap:32px;position:relative;overflow:hidden}
.authhero::before,.authhero::after{content:"";position:absolute;border-radius:50%;border:1px solid currentColor;opacity:.14;pointer-events:none}
.authhero::before{width:520px;height:520px;right:-180px;bottom:-200px}
.authhero::after{width:320px;height:320px;right:-60px;bottom:-90px}
.authhero .brand{color:inherit}.authhero .brand .logo{height:40px}
.authhero .brand .logo-l,.authhero .brand .logo-d{display:none}.authhero .brand .logo-w{display:var(--logo-hw)}.authhero .brand .logo-n{display:var(--logo-hn)}
.authhero h2{font-family:var(--f-display);font-size:clamp(34px,4.2vw,52px);line-height:1.05;font-weight:700;letter-spacing:-.01em;max-width:13ch}
.authhero p{font-size:16px;opacity:.85;max-width:38ch;margin-top:14px;line-height:1.5}
.authhero ul{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;position:relative;z-index:1}
.authhero li{font-size:13px;font-weight:600;padding:6px 12px;border-radius:99px;border:1px solid currentColor;opacity:.9}
.authhero .mid{position:relative;z-index:1}
.authside{display:grid;place-items:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.authside .authcard{gap:18px}
.authside .authcard>div h1{font-size:30px}
.authside form.panel{padding:22px;box-shadow:0 1px 2px rgba(15,25,35,.06),0 8px 24px rgba(15,25,35,.06)}
.pinbox{position:relative;display:flex}
.pinbox .in{flex:1;padding-right:48px}
.pinbox .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;color:var(--fg-3);border-radius:8px;display:grid;place-items:center;cursor:pointer}
.pinbox .eye:hover{color:var(--fg);background:var(--surface-2)}
.pinbox .eye svg{width:20px;height:20px}
@media(max-width:860px){
  .auth2{grid-template-columns:1fr}
  .authhero{padding:24px 20px 26px;gap:16px}
  .authhero .mid h2{font-size:28px;max-width:none}
  .authhero p,.authhero ul,.authhero::after{display:none}
  .authhero::before{width:300px;height:300px;right:-110px;bottom:-170px}
  .authside{align-items:start;padding-top:24px}
}
.demo{font-size:13px;color:var(--fg-2);border-top:1px dashed var(--line);padding-top:14px}
.demo code{font-family:var(--f-mono);background:var(--surface-2);padding:1px 6px;border-radius:4px}
.err{color:var(--ng);background:var(--ng-bg);padding:10px 12px;border-radius:8px;font-size:14px}
.note{background:var(--hold-bg);color:var(--hold);padding:10px 14px;border-radius:8px;font-size:14px}

/* ticker strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.strip>div{padding:16px 20px;border-left:1px solid var(--line);min-width:0}
.strip>div:first-child{border-left:0}
.strip .n{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.strip .l{font-size:13px;color:var(--fg-2)}

/* process rows */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px;margin-top:14px}
.mstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.mstats>div{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
.mstats .n{font-size:22px;font-weight:700;font-family:var(--f-mono);line-height:1.15;overflow-wrap:anywhere}
.mstats .l{font-size:12px;color:var(--fg-2);margin-top:2px}
.ana{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.ana li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.45;overflow-wrap:anywhere}
.ana li:before{content:'';flex:none;width:8px;height:8px;border-radius:50%;background:var(--X);margin-top:7px}
.ana li.warn:before{background:var(--ng)}.ana li.good:before{background:var(--ok)}.ana li.note:before{background:var(--hold)}
@media (max-width:520px){.mstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.prow{display:grid;grid-template-columns:minmax(150px,200px) minmax(0,1fr) 120px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .nm{display:flex;align-items:center;gap:10px;font-weight:500}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.bar span{display:block;height:100%}
.bar .b-ok{background:var(--ok)} .bar .b-hold{background:var(--hold)} .bar .b-ng{background:var(--ng)}
.prow .ct{font-size:13px;color:var(--fg-2);text-align:right;font-variant-numeric:tabular-nums}

/* start buttons */
.starts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.start{display:flex;align-items:center;gap:14px;text-align:left;min-height:68px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.start:hover{border-color:var(--accent)}
.start b{display:block;font-weight:600}
.start small{color:var(--fg-3);font-size:13px}
.start svg{width:18px;height:18px;margin-left:auto;color:var(--fg-3);flex:none}
.grp{display:flex;flex-direction:column;gap:10px}
.grp h3{display:flex;align-items:center;gap:10px}

/* lists */
.filters{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr));gap:10px}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);text-align:left;font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr[data-act="open"]{cursor:pointer}
tr[data-act="open"]:hover td{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.cell2{display:flex;flex-direction:column;min-width:0}
.cell2 small{color:var(--fg-3);font-size:13px}
.cards{display:none;flex-direction:column;gap:10px}
.card{display:flex;flex-direction:column;gap:6px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:left;width:100%}
.card .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.card .r2{display:flex;align-items:center;gap:8px;font-weight:500}
.card .r3{font-size:13px;color:var(--fg-3);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.empty{padding:36px 20px;text-align:center;color:var(--fg-2);display:flex;flex-direction:column;gap:6px;align-items:center}
.vmark{display:inline-flex;align-items:center;gap:4px;color:var(--ok);font-size:13px;font-weight:500}
.vmark svg{width:16px;height:16px}

/* report form */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.meas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.meas{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.meas[data-s="ng"]{border-color:var(--ng);background:var(--ng-bg)}
.meas[data-s="ok"]{border-color:var(--ok)}
.meas .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.meas .h label{font-weight:600}
.meas .spec{font-size:12.5px;color:var(--fg-2);font-family:var(--f-mono);text-align:right}
.meas .inp{display:flex;align-items:center;gap:8px}
.meas .inp .unit{color:var(--fg-2);font-size:13px;white-space:nowrap}
.meas .pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meas .pair span.sub{font-size:12px;color:var(--fg-3);display:block;margin-bottom:2px}
.meas .foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chk{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:10px 16px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk[data-s="ng"] .q{color:var(--ng);font-weight:600}
.chk.miss{background:var(--hold-bg);border-radius:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none;inset:0}
.seg label{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600;color:var(--fg-2);cursor:pointer;font-size:14px}
.seg input:checked+label.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.seg input:checked+label.ng{background:var(--ng-bg);border-color:var(--ng);color:var(--ng)}
.seg input:checked+label.bl{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg input:checked+label.na{background:var(--surface-2);border-color:var(--fg-3);color:var(--fg)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.seg .cell{position:relative}
.seg .cell input{inset:0;width:100%;height:100%;margin:0}
.seg.two{grid-template-columns:repeat(2,1fr)}
.totalbox{min-height:44px;display:flex;align-items:center;padding:0 12px;border:1px dashed var(--line);border-radius:8px;font-family:var(--f-mono);font-weight:500;background:var(--surface-2);overflow-wrap:anywhere}
.qtygrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qcell{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.qcell .n{font-size:26px;font-weight:500;line-height:1.2;overflow-wrap:anywhere}
.is-form .main{padding-bottom:0}
.is-form #rform{margin-bottom:0!important}
.formbar{position:sticky;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);margin-inline:calc(-1*max(32px,env(safe-area-inset-left,0px)));padding:12px max(32px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(32px,env(safe-area-inset-left,0px));display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.autores{display:flex;flex-direction:column;gap:2px;min-width:0}
.autores b{font-weight:600}

/* modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;justify-content:flex-end}

/* ================= STATE & STORAGE ================= */
const S={mode:'init',sf:{q:'',st:'open'},ag:{q:'',st:'due',view:'jadwal'},agPick:[],agingSel:[],dm:null,drafts:[],activeDraft:null,domDraft:null,confirmDraft:null,users:[],reports:[],memos:[],memoReads:[],memoId:null,tf:{q:'',proc:'all',st:'all',range:'all'},usersLoaded:false,meId:null,view:'dash',formProc:null,dispTouched:false,
  delReps:[],detailId:null,confirmDel:null,confirmSdel:null,modal:null,userEdit:null,dbError:false,canDownload:false,
  filters:{q:'',proc:'all',disp:'all',range:(()=>{const n=new Date();return 'm:'+n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')})()}};
let dbh=null,dlh=null;
const LS={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
function loadLocal(){
  try{S.users=JSON.parse(LS.get('lqc.users')||'[]')}catch(e){S.users=[]}
  try{S.reports=JSON.parse(LS.get('lqc.reports')||'[]')}catch(e){S.reports=[]}
  S.delReps=[];splitDel();
  try{S.memos=JSON.parse(LS.get('lqc.memos')||'[]')}catch(e){S.memos=[]}
  try{S.memoReads=JSON.parse(LS.get('lqc.memoReads')||'[]')}catch(e){S.memoReads=[]}
}
function persistLocal(){LS.set('lqc.users',JSON.stringify(S.users));LS.set('lqc.reports',JSON.stringify(S.reports.concat(S.delReps)));LS.set('lqc.memos',JSON.stringify(S.memos));LS.set('lqc.memoReads',JSON.stringify(S.memoReads))}
function splitDel(){const nd=S.reports.filter(r=>r.del);if(nd.length||S.delReps.length){S.reports=S.reports.filter(r=>!r.del);S.delReps=S.delReps.filter(x=>!S.reports.some(y=>y.id===x.id)&&!nd.some(y=>y.id===x.id)).concat(nd)}}
function sortCol(c){if(c==='reports'||c==='memos')S[c].sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));if(c==='reports')splitDel()}
function sortReports(){S.reports.sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));splitDel()}
async function put(col,doc){
  const id=doc.id,body=Object.assign({},doc);delete body.id;
  if(dbh)await dbh.collection(col).doc(id).set(body);
  const arr=S[col],i=arr.findIndex(x=>x.id===id);
  if(i>=0)arr[i]=doc;else arr.push(doc);
  sortCol(col);
  if(!dbh)persistLocal();
  onData();
}
async function remove(col,id){
  if(dbh)await dbh.collection(col).doc(id).delete();
  S[col]=S[col].filter(x=>x.id!==id);
  if(!dbh)persistLocal();
  onData();
}
function errMsg(e){
  const c=e&&e.code;
  if(c==='invalid_argument')return 'Anda hanya punya akses baca. Minta akses Kontributor ke pemilik halaman.';
  if(c==='quota_exceeded')return 'Penyimpanan penuh. Hapus laporan lama atau hubungi pemilik halaman.';
  if(c==='resource_exhausted')return 'Terlalu banyak permintaan. Tunggu sebentar lalu coba lagi.';
  return 'Gagal menyimpan. Periksa koneksi lalu coba lagi.';
}
async function safe(fn){try{await fn();return true}catch(e){toast(errMsg(e),true);return false}}

/* Penyimpanan online (Supabase, lewat REST) untuk dipakai di GitHub Pages. Aktif jika config.js diisi. */
function makeSupabase(cfg){
  const base=String(cfg.supabaseUrl).replace(/\/+$/,'')+'/rest/v1/docs';
  const H={apikey:cfg.supabaseKey};
  if(/^eyJ/.test(cfg.supabaseKey))H.Authorization='Bearer '+cfg.supabaseKey;
  const netErr=()=>{const e=new Error('net');e.code='network';return e};
  let lastWrite=0;
  async function fetchAll(col){
    let out=[],from=0;
    for(;;){
      const res=await fetch(base+'?col=eq.'+encodeURIComponent(col)+'&select=id,data,updated_at&order=id.asc&limit=1000&offset='+from,{headers:H});
      if(!res.ok)throw netErr();
      const rows=await res.json();out=out.concat(rows);
      if(rows.length<1000)break;from+=1000;
    }
    return out;
  }
  return {collection(col){return {
    onSnapshot(cb,onErr){
      let sig=null;
      const tick=async()=>{
        if(document.hidden&&sig!==null)return;
        const t0=Date.now();
        try{
          const rows=await fetchAll(col);
          if(lastWrite>=t0)return;
          const mx=rows.reduce((a,r)=>r.updated_at>a?r.updated_at:a,'');
          const sg=rows.length+'|'+mx;
          if(sg===sig)return;
          sig=sg;
          cb({docs:rows.map(r=>({id:r.id,data:()=>r.data||{}}))});
        }catch(e){if(sig===null){sig='';onErr&&onErr(e)}}
      };
      tick();setInterval(tick,6000);
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
    },
    doc(id){return {
      async set(body){
        const res=await fetch(base+'?on_conflict=col,id',{method:'POST',headers:Object.assign({'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},H),body:JSON.stringify({col,id,data:body,updated_at:new Date().toISOString()})});
        lastWrite=Date.now();
        if(!res.ok)throw netErr();
      },
      async delete(){
        const res=await fetch(base+'?col=eq.'+encodeURIComponent(col)+'&id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:H});
        lastWrite=Date.now();
        if(!res.ok)throw netErr();
      }
    }}
  }}};
}
function downloadText(filename,text){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
async function init(){
  render();
  let db=null,dl=null;
  try{if(window.claude&&window.claude.use){db=await window.claude.use('db');dl=await window.claude.use('downloads')}}catch(e){}
  const cfg=window.IQC_CONFIG;
  if(!db&&cfg&&cfg.supabaseUrl&&cfg.supabaseKey){db=makeSupabase(cfg);S.remote=true}
  dbh=db;dlh=dl;S.canDownload=!!dl||!!S.remote;
  if(db){
    S.mode='db';
    db.collection('users').onSnapshot(s=>{S.users=s.docs.map(d=>Object.assign({id:d.id},d.data()));S.usersLoaded=true;onData()},fail);

/* ================= EVALUASI ================= */
function mStatus(m,v,t){
  const x=typeof v==='number'?v:parseNum(v);
  if(isNaN(x))return 'empty';
  if(m.target){const tt=typeof t==='number'?t:parseNum(t);if(isNaN(tt))return 'empty';return Math.abs(x-tt)<=m.tol+1e-9?'ok':'ng'}
  if(m.min!=null&&x<m.min)return 'ng';
  if(m.max!=null&&x>m.max)return 'ng';
  return 'ok';
}
function specText(m){
  if(m.target)return 'Target ±'+fmtNum(m.tol)+' '+m.unit;
  if(m.min!=null&&m.max!=null)return fmtNum(m.min)+'–'+fmtNum(m.max)+' '+m.unit;
  if(m.min!=null)return 'min '+fmtNum(m.min)+' '+m.unit;
  if(m.max!=null)return 'maks '+fmtNum(m.max)+' '+m.unit;
  return 'Dicatat';
}
function evalData(P,d){
  const bad=[];let missing=0;
  P.measures.forEach(m=>{const s=mStatus(m,d.vals[m.k],d.targets[m.k]);if(s==='ng')bad.push(m.label);if(s==='empty')missing++});
  P.checks.forEach(c=>{const v=d.checks[c.k];if(v==='ng')bad.push(c.label);if(!v)missing++});
  return {bad,missing};
}

function procBtn(p){

function groupsHTML(allowed){
  let h='';

    const items=g.items.filter(i=>allowed.includes(i));

    h+='<section class="grp g-'+g.id+'"><h3><span class="pdot"></span>'+esc(g.label)+'</h3><div class="starts">'+items.map(procBtn).join('')+'</div></section>';
  });

}

function grpMonth(gid,y,m){
  const m0=new Date(y,m,1),m1=new Date(y,m+1,1),inM=r=>{const t=new Date(r.createdAt);return t>=m0&&t<m1};
  const rs=visibleReports().filter(r=>inM(r)&&grpOf(r)===gid&&!r.vid);
  const ti=tolakanItems().filter(r=>inM(r)&&grpOf(r)===gid&&isTolakan(r)&&allowedProcs().includes(r.proc));
  const bad=rs.filter(r=>PROC[r.proc].aging?(r.rolls||[]).some(rollNG):isTolakan(r)).length;
  const n=rs.length,u={};
  ti.forEach(r=>{const k=r.vid?'roll':unitOf(r),q=r.vid?1:(r.lamSt?(r.qn>0?r.qn:((r.qp||0)+(r.qn||0))):(r.qn||0));if(q>0)u[k]=(u[k]||0)+q});
  const qty=Object.keys(u).map(k=>fmtInt(u[k])+' '+k).join(' · ');
  const sh={};ti.forEach(r=>{const k=r.shift||'?';sh[k]=(sh[k]||0)+1});
  const cs={};ti.forEach(r=>String(r.defect||'').split(/[;\n]+/).forEach(x=>{x=x.trim().replace(/[.,]+$/,'');if(!x)return;const k=x.toLowerCase();(cs[k]=cs[k]||{t:x,n:0}).n++}));
  const causes=Object.values(cs).sort((a,b)=>b.n-a.n).slice(0,3);
  const pend=ti.filter(r=>canAct(r)&&!r.tindakan).length;
  return {rs,ti,n,bad,pct:n?Math.round((n-bad)/n*100):null,qty,sh,causes,pend};
}
function monthInsights(c,p,prevName){
  if(!c.n)return [['note','Belum ada laporan pada bulan ini.']];
  const out=[],e=esc;
  let tr='';
  if(p.n){const d=c.pct-p.pct;tr=Math.abs(d)<1?', stabil dibanding '+e(prevName):d>0?', naik '+d+' poin dari '+e(prevName)+' ('+p.pct+'%)':', turun '+(-d)+' poin dari '+e(prevName)+' ('+p.pct+'%)'}
  else tr=' (belum ada data '+e(prevName)+' sebagai pembanding)';
  out.push([c.pct>=95?'good':c.pct>=85?'note':'warn','<b>QC Pass '+c.pct+'%</b> dari '+c.n+' laporan'+tr+'.']);
  if(!c.ti.length)out.push(['good','Tidak ada tolakan sepanjang bulan ini.']);
  else{
    out.push(['warn','<b>'+c.ti.length+' item tolakan</b>'+(c.qty?' dengan total '+e(c.qty):'')+'.']);
    const ks=Object.keys(c.sh).sort((a,b)=>c.sh[b]-c.sh[a]);
    if(c.ti.length>=3&&c.sh[ks[0]]/c.ti.length>=0.5)out.push(['note','<b>Shift '+e(ks[0])+'</b> paling banyak tolakan ('+c.sh[ks[0]]+' dari '+c.ti.length+' item). Perlu perhatian lebih pada shift ini.']);
    else if(ks.length>1)out.push(['note','Tolakan per shift: '+ks.map(k=>'Shift '+e(k)+' ('+c.sh[k]+')').join(', ')+'.']);
    if(c.causes.length)out.push(['note','Penyebab terbanyak: '+c.causes.map(x=>e(x.t.length>60?x.t.slice(0,60)+'…':x.t)+' ('+x.n+'x)').join('; ')+'.']);
    out.push([c.pend?'warn':'good',c.pend?'<b>'+c.pend+' tolakan</b> belum diberi tindakan.':'Semua tolakan sudah diberi tindakan.']);
  }
  return out;
}

/* ================= DRAF PARALEL ================= */
/* Operator bisa membuka beberapa laporan sekaligus. Isian tiap draf tersimpan otomatis di browser ini. */
const MAXDRAFT=10;
const DKEY=()=>'lqc.drafts.'+S.meId;
const curDraft=()=>S.drafts.find(d=>d.id===S.activeDraft)||null;
function visibleDrafts(){const a=allowedProcs(),c=canCreate();return S.drafts.filter(d=>PROC[d.proc]&&a.includes(d.proc)&&(c||d.editId))}
function loadDrafts(){
  S.drafts=[];S.activeDraft=null;S.domDraft=null;S.confirmDraft=null;
  if(!S.meId)return;
  try{
    const o=JSON.parse(LS.get(DKEY())||'null');
    if(o&&Array.isArray(o.drafts)){S.drafts=o.drafts.filter(d=>d&&d.id&&d.proc);S.activeDraft=S.drafts.some(d=>d.id===o.active)?o.active:(S.drafts[0]?S.drafts[0].id:null)}
  }catch(e){S.drafts=[]}
}
function saveDrafts(){
  if(!S.meId)return;
  if(!S.drafts.length)LS.del(DKEY());else LS.set(DKEY(),JSON.stringify({drafts:S.drafts,active:S.activeDraft}));
}
function captureDraft(){
  const f=$('#rform'),d=curDraft();
  if(!f||!d||S.domDraft!==d.id)return;
  const data={};
  Array.from(f.elements).forEach(el=>{
    if(!el.name||el.type==='button'||el.type==='submit')return;
    if(el.type==='radio'){if(el.checked)data[el.name]=el.value}
    else data[el.name]=el.value;
  });
  d.data=data;d.touched={disp:!!S.dispTouched,kts:!!S.ktsTouched};d.at=Date.now();
}
function restoreDraft(){
  const f=$('#rform'),d=curDraft();
  if(!f||!d)return;
  const data=d.data||{};
  Object.keys(data).forEach(k=>{
    const el=f.elements[k];if(!el)return;
    const list=el.tagName?[el]:Array.from(el);
    if(!list.length)return;
    if(list[0].type==='radio')list.forEach(r=>{r.checked=(r.value===data[k])});
    else list[0].value=data[k];
  });
  S.dispTouched=!!(d.touched&&d.touched.disp);S.ktsTouched=!!(d.touched&&d.touched.kts);
  S.domDraft=d.id;
  if(S.confirmDraft===d.id){
    $$('[data-act="cancelform"]').forEach(b=>{b.classList.add('danger');const tn=Array.from(b.childNodes).find(n=>n.nodeType===3);if(tn)tn.textContent='Ya, buang draf'});
  }
  updateForm();
}
function hasData(d){
  const skip=['shift','date','disp','kts'];
  return Object.keys(d.data||{}).some(k=>!skip.includes(k)&&String(d.data[k]).trim()!=='');
}
const draftSub=d=>d.editId?('Edit '+(d.editNo||'')):(((d.data&&d.data.wo)||'').trim()||'Belum diisi');
function refreshTab(f){
  const cd=curDraft(),el=$('.dtab.on .dsub');
  if(el&&f.elements.wo&&!(cd&&cd.editId))el.textContent=f.elements.wo.value.trim()||'Belum diisi';
}
function newDraft(proc,seed){
  const d={id:uid('d'),proc,data:seed||{},touched:{},at:Date.now()};
  S.drafts.push(d);S.activeDraft=d.id;S.domDraft=null;S.confirmDraft=null;
  return d;
}
function openDraft(id){
  if(S.view==='form')captureDraft();
  const d=S.drafts.find(x=>x.id===id);if(!d)return;
  S.activeDraft=id;S.confirmDraft=null;S.view='form';
  saveDrafts();render();window.scrollTo(0,0);
}
function removeDraft(id){
  const i=S.drafts.findIndex(d=>d.id===id);if(i<0)return null;
  const wasActive=S.activeDraft===id;
  S.drafts.splice(i,1);S.confirmDraft=null;
  let next=null;
  if(wasActive){
    const vis=visibleDrafts();
    next=vis[Math.min(i,vis.length-1)]||null;
    S.activeDraft=next?next.id:null;S.domDraft=null;
  }
  saveDrafts();
  return next;
}
function askDiscard(id){
  if(S.view==='form')captureDraft();
  const d=S.drafts.find(x=>x.id===id);if(!d)return;
  if(hasData(d)&&S.confirmDraft!==id){S.confirmDraft=id;saveDrafts();render();return}
  const wasActive=S.activeDraft===id;
  const next=removeDraft(id);
  if(wasActive)S.view=next?'form':(canCreate()?'new':'list');
  toast('Draf dibuang');render();window.scrollTo(0,0);
}
function afterSave(doc,did){
  const wasActive=S.activeDraft===did;
  const next=removeDraft(did);
  const left=visibleDrafts().length;
  toast('Laporan '+doc.wo+' tersimpan'+(left?'. '+left+' laporan lain masih terbuka.':''));
  if(wasActive)S.view=next?'form':(isSpv()?'list':'dash');
  render();window.scrollTo(0,0);
}
let dsT=null;
function queueSave(){clearTimeout(dsT);dsT=setTimeout(()=>{if(S.view==='form'){captureDraft();saveDrafts()}},400)}
function draftBarHTML(){
  const ds=visibleDrafts();if(!ds.length)return '';
  const tabs=ds.map(d=>{
    const P=PROC[d.proc],on=d.id===S.activeDraft,sure=S.confirmDraft===d.id;
    return '<div class="dtab g-'+P.group+(on?' on':'')+'"><button type="button" class="dsel" role="tab" aria-selected="'+on+'" data-act="draftgo" data-id="'+d.id+'"><span class="pdot"></span><span class="tx"><b>'+esc(P.label)+'</b><span class="dsub">'+esc(draftSub(d))+'</span></span></button>'+
      '<button type="button" class="dx'+(sure?' sure':'')+'" data-act="draftx" data-id="'+d.id+'" aria-label="Buang draf '+esc(P.label)+'">'+(sure?'Buang?':ic('x'))+'</button></div>';
  }).join('');
  return '<div class="draftbar" role="tablist" aria-label="Laporan yang sedang diisi">'+tabs+
    (canCreate()?'<button type="button" class="dnew" data-act="draftadd" title="Laporan baru" aria-label="Laporan baru"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>'+
    '<button type="button" class="ddup" data-act="draftdup" title="Buat laporan baru dengan No. PR, produk, dan customer yang sama">'+ic('copy')+'Salin data produk</button>':'')+'</div>';
}
function resumeHTML(){
  const ds=visibleDrafts();if(!ds.length)return '';
  return '<section class="grp"><h3>Sedang diisi ('+ds.length+')</h3><div class="starts">'+ds.map(d=>{const P=PROC[d.proc];
    return '<button class="start g-'+P.group+'" data-act="draftgo" data-id="'+d.id+'"><span class="pdot"></span><span><b>'+esc(P.label)+'</b><small>'+esc(draftSub(d))+' · lanjutkan</small></span>'+ic('arrow')+'</button>'}).join('')+'</div></section>';
}

/* ================= EDIT LAPORAN & RIWAYAT EDIT ================= */
/* Operator boleh mengubah laporannya sendiri kapan saja. SPV ke atas boleh mengubah semua laporan.
   Setiap perubahan butuh alasan dan dicatat di r.edits (siapa, kapan, alasan, nilai lama dan baru). */
function canEditReport(r){
  const me=getMe();
  if(!me||!PROC[r.proc]||!allowedProcs().includes(r.proc)||legacyP(r))return false;
  if(me.role==='viewer')return false;
  if(isSpv())return true;
  return r.operatorId===me.id;
}
function canDeleteReport(r){
  const me=getMe();
  if(!me||r.vid||!PROC[r.proc]||!allowedProcs().includes(r.proc)||me.role==='viewer')return false;
  return isSpv()||r.operatorId===me.id;
}
const delConfirmHTML=r=>'<div class="hitem" style="flex:1 1 100%;border-color:var(--ng);background:var(--ng-bg)"><b style="color:var(--ng)">Hapus laporan ini?</b><p class="muted" style="font-size:14px;margin:4px 0 10px">Laporan hilang dari semua daftar, tapi tetap tercatat di Riwayat Hapus dan bisa dipulihkan oleh QC Ass SPV ke atas.</p><label for="delReason" style="font-weight:600;font-size:14px">Alasan penghapusan <span style="color:var(--ng)">*</span></label><textarea class="in" id="delReason" rows="2" placeholder="Contoh: salah input No. PR, laporan dobel" style="margin:6px 0 10px"></textarea><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn danger" data-act="delyes" data-id="'+r.id+'">'+ic('trash')+'Ya, hapus laporan</button><button class="btn ghost" data-act="delno">Batal</button></div></div>';
const delBtn=r=>'<button class="btn danger" data-act="del" data-id="'+r.id+'">'+ic('trash')+'Hapus laporan</button>';
const editedChip=r=>(r.edits&&r.edits.length)?chip('mute','Diedit'):'';
const sortSt=r=>(r.sortir&&r.sortir.status)||'belum';
function statusChip(r){
  const P0=PROC[r.proc];
  if(P0&&P0.aging&&!r.vid&&(r.rolls||[]).length){
    const ngs=r.rolls.filter(rollNG),bl=r.rolls.filter(k=>!rollNG(k)&&((k.check?k.check.status:k.s)==='biru')).length,g={};
    ngs.forEach(k=>{const key=(k.tindakan&&TINDAKAN[k.tindakan])?k.tindakan:'_';g[key]=(g[key]||0)+1});
    const acc=ngs.filter(k=>k.tindakan==='diterima').length;
    delete g.diterima;
    const ch=Object.keys(g).map(key=>key==='_'?chip('ng',g[key]+' roll Not Pass'):chip(TINDAKAN[key].c,g[key]+' roll '+TINDAKAN[key].t)).join('');
    return ch+(bl?chip('info',bl+' Label Biru'):'')||chip('ok','QC Passed');
  }
  if(r.lamSt&&!r.vid){
    const t0=r.tindakan&&TINDAKAN[r.tindakan];
    if(r.lamSt==='pass')return chip('ok','QC Passed');
    if(r.lamSt==='biru')return chip('info','Label Biru')+(t0?chip(t0.c,t0.t):'');
    if(r.tindakan==='diterima')return chip('ok','QC Passed');
    return t0?chip(t0.c,t0.t):chip('ng','QC Not Pass');
  }
  if(r.vid&&!r.tindakan)return chip('ng','Not Pass');
  const t=r.tindakan&&TINDAKAN[r.tindakan];
  const ngc=(logOf(r)&&r.qn>0&&!r.vid)?chip('ng',fmtInt(r.qn)+' '+unitOf(r)+' NG'):'';
  if(r.tindakan==='diterima'&&!r.vid)return chip('ok','QC Passed');
  if(t){
    if(isSortirT(r.tindakan)&&!r.vid&&inSort(r)){const x=sortSt(r);if(x==='selesai')return ngc+chip('ok','Sortir selesai');if(x==='proses')return ngc+chip('hold','Sortir berjalan')}
    return ngc+chip(t.c,t.t);
  }
  return ngc||(r.disp==='lulus'?chip('ok','QC Passed'):dispChip(r.disp));
}

const dv=v=>(v==null||v==='')?'—':(typeof v==='number'?fmtNum(v):String(v).trim()||'—');
const CKL={ok:'OK',ng:'NG',na:'N/A'};
function diffReport(P,a,b){
  const out=[],add=(label,x,y)=>{const sx=dv(x),sy=dv(y);if(sx!==sy)out.push({label,from:sx,to:sy})};
  const cond=v=>v==='ok'?'OK':v?'Tidak OK':'';
  if(P.kind==='log'){
    add('Tanggal',ymd(new Date(a.createdAt)),ymd(new Date(b.createdAt)));
    [['shift','Shift'],['wo','No. PR'],['product','Nama produk'],['customer','Customer'],['sub','Jenis rewind'],['size',P.sizeLabel?'Ukuran potong':'Ukuran kantong'],['machine','Nama mesin'],['op','OP mesin']].forEach(x=>add(x[1],a[x[0]],b[x[0]]));
    add('Kondisi mesin',cond(a.cond),cond(b.cond));
    if(P.rangeWarna)add('Range warna',a.rangeWarna==='ada'?'Ada':a.rangeWarna==='tidak'?'Tidak ada':'',b.rangeWarna==='ada'?'Ada':b.rangeWarna==='tidak'?'Tidak ada':'');

    add('No. dus sudah diproses',a.dusOk,b.dusOk);add(P.dusCount?'No. jumbo terjadi defect':'No. dus QC Not Pass',a.dusNg,b.dusNg);
    if(P.ext){add('Jumlah roll diproses',a.rollN,b.rollN);add('Kuantitas total (m)',(a.qp||0)+(a.qn||0),(b.qp||0)+(b.qn||0));add('Kuantitas KTS (m)',a.qn,b.qn);add('Kuantitas QC Pass (m)',a.qp,b.qp);add('Speed mesin',a.speed,b.speed);add('Status QC',(AG_ST[a.lamSt]||{}).t,(AG_ST[b.lamSt]||{}).t);add('No. roll defect KTS',a.rollNg,b.rollNg)}
    else{add('QC Pass ('+(P.unit||'pcs')+')',a.qp,b.qp);add('QC Not Pass ('+(P.unit||'pcs')+')',a.qn,b.qn)}
    if(P.dusCount)add('Status QC',(AG_ST[a.lamSt]||{}).t,(AG_ST[b.lamSt]||{}).t);
    add('KTS',a.kts==='ada'?'Ada':'Tidak ada',b.kts==='ada'?'Ada':'Tidak ada');
    add('Keterangan defect',a.defect,b.defect);
  }else{
    [['shift','Shift'],['wo','No. PR'],['product','Produk'],['customer','Customer'],['machine','Mesin'],['batch','No. batch / roll']].filter(x=>!P.dry||!/machine|batch/.test(x[0])).forEach(x=>add(x[1],a[x[0]],b[x[0]]));
    if(P.dry){add('QC Lami Inspector',a.inspector,b.inspector);add('KTS',a.kts==='ada'?'Ada':'Tidak ada',b.kts==='ada'?'Ada':'Tidak ada');add('Keterangan KTS',a.defect,b.defect)}
    if(P.aging){add('Komposisi',a.komposisi,b.komposisi);add('Durasi aging (hari)',a.agingDays,b.agingDays);add('Roll',rollsText(a),rollsText(b))}
    P.measures.forEach(m=>{
      add(m.label+(m.unit?' ('+m.unit+')':''),(a.vals||{})[m.k],(b.vals||{})[m.k]);
      if(m.target)add('Target '+m.label,(a.targets||{})[m.k],(b.targets||{})[m.k]);
    });
    P.checks.forEach(c=>add(c.label,CKL[(a.checks||{})[c.k]],CKL[(b.checks||{})[c.k]]));
    add('Disposisi',(DISP[a.disp]||{}).t,(DISP[b.disp]||{}).t);
    add('Catatan',a.note,b.note);
  }
  return out;
}
async function commitEdit(dr,doc,f,did){
  const me=getMe(),box=$('#formErr');
  const fail=m=>{box.textContent=m;box.hidden=false;box.scrollIntoView({block:'center',behavior:'smooth'})};
  const latest=S.reports.find(x=>x.id===dr.editId);
  if(!latest)return fail('Laporan ini sudah dihapus. Buang draf ini.');
  if(!canEditReport(latest))return fail('Anda tidak lagi punya izin mengubah laporan ini.');
  if((latest.edits||[]).length!==dr.base)return fail('Laporan ini baru saja diubah oleh orang lain. Buang draf ini, lalu buka laporan dan pilih Edit lagi.');
  const reason=f.elements['reason']?f.elements['reason'].value.trim():'';
  if(!reason)return fail('Isi alasan perubahan.');
  const P=PROC[latest.proc],log=P.kind==='log',next=Object.assign({},latest);
  const keys=log?['shift','wo','product','customer','machine','size','sub','op','cond','dusOk','dusNg','rangeWarna','qp','qn','kts','defect','rollN','speed','rollNg','lamSt']:(P.dry?['shift','wo','product','customer','note','inspector','kts','defect']:['shift','wo','product','customer','machine','batch','vals','targets','checks','note']);
  keys.forEach(k=>{next[k]=doc[k]});
  if(P.aging){['komposisi','agingDays','agingIn'].forEach(k=>{next[k]=doc[k]});next.rolls=(doc.rolls||[]).map(rr=>{const o=(latest.rolls||[]).find(x=>x.id===rr.id);if(!o)return rr;const kp={};['check','tindakan','tindakanNote','tindakanBy','sortir','sortirLog'].forEach(x=>{if(o[x]!==undefined)kp[x]=o[x]});return Object.assign({},rr,kp)})}
  next.auto=doc.auto;
  if(log){
    const orig=new Date(latest.createdAt),dvv=f.elements['date']?f.elements['date'].value:'';
    if(dvv&&dvv!==ymd(orig))next.createdAt=new Date(dvv+'T'+pad(orig.getHours())+':'+pad(orig.getMinutes())+':'+pad(orig.getSeconds())).toISOString();
    next.disp=latest.tindakan?latest.disp:doc.disp;
  }else next.disp=doc.disp;
  const changes=diffReport(P,latest,next);
  if(!changes.length)return fail('Belum ada perubahan dari laporan sebelumnya.');
  next.verified=null;
  next.edits=(latest.edits||[]).concat([{at:new Date().toISOString(),by:me.id,name:me.name,role:me.role,reason,changes}]);
  const btn=f.querySelector('button[type=submit]');btn.disabled=true;
  const ok=await safe(()=>put('reports',next));
  btn.disabled=false;
  if(!ok)return;
  const wasActive=S.activeDraft===did,nd=removeDraft(did),left=visibleDrafts().length;
  toast('Perubahan laporan '+next.wo+' disimpan'+(left?'. '+left+' laporan lain masih terbuka.':''));
  if(wasActive){if(nd)S.view='form';else{S.view='list';S.detailId=next.id}}
  render();window.scrollTo(0,0);
}

  if(isNaN(days)||days<=0)errs.push('Isi durasi aging (hari).');

  while(E('rn_'+i)){
    const no=E('rn_'+i).value.trim(),mraw=E('rm_'+i).value,m=toInt(mraw);
    if(no||String(mraw).trim()){
      if(!no)errs.push('Roll baris '+(i+1)+': isi No. Roll.');
      else if(seen[no.toLowerCase()])errs.push('No. Roll '+no+' dobel.');
      if(isNaN(m))errs.push('Roll '+(no||('baris '+(i+1)))+': isi kuantitas (m).');
      seen[no.toLowerCase()]=1;
      const dt=E('rd_'+i).value;
      if(!dt)errs.push('Roll '+(no||('baris '+(i+1)))+': isi tanggal dan jam masuk aging.');
      rolls.push({id:E('ri_'+i).value||('k'+Date.now().toString(36)+i),no,m:isNaN(m)?0:m,s:agS(E('rs_'+i).value),in:dt?new Date(dt).toISOString():''});
    }
    i++;
  }
  if(!rolls.length)errs.push('Isi minimal satu roll.');
  const ins=rolls.map(k=>k.in).filter(Boolean).sort(),agingIn=ins[0]||'';
  return {errs,komposisi:E('komposisi').value.trim(),agingDays:isNaN(days)?0:days,agingIn,rolls};
}
function readForm(f,P){
  const vals={},targets={},checks={};
  P.measures.forEach(m=>{
    const v=parseNum(f.elements['m_'+m.k].value);if(!isNaN(v))vals[m.k]=v;
    if(m.target){const t=parseNum(f.elements['t_'+m.k].value);if(!isNaN(t))targets[m.k]=t}
  });
  P.checks.forEach(c=>{const el=f.querySelector('input[name="c_'+c.k+'"]:checked');if(el)checks[c.k]=el.value});
  return {vals,targets,checks};
}
function updateForm(){

  if(P.dry){updatePlan(f);return}

async function submitReport(f){
  const did=S.activeDraft;
  const me=getMe(),pid=f.dataset.p,P=PROC[pid];
  if(P.kind==='log')return submitLog(f,P);
  const d=readForm(f,P),r=evalData(P,d);
  const wo=f.wo.value.trim(),product=f.product.value.trim(),note=f.note?f.note.value.trim():'';
  const errs=[];
  if(!wo)errs.push('Isi No. PR.');
  if(!product)errs.push('Isi nama produk.');
  const ag=P.aging?readAging(f):null;
  if(ag)ag.errs.forEach(e=>errs.push(e));
  const insp=P.dry?f.elements['insp'].value.trim():'';
  if(P.dry&&!insp)errs.push('Isi nama QC Lami Inspector.');
  const kts=P.dry?((f.querySelector('input[name="kts"]:checked')||{}).value||'tidak'):'',defect=P.dry?f.elements['defect'].value.trim():'';
  if(P.dry&&kts==='ada'&&!defect)errs.push('Isi keterangan KTS.');
  if(r.missing){
    errs.push('Masih ada '+r.missing+' item pengukuran atau pengecekan yang kosong.');
    P.checks.forEach(c=>{if(!d.checks[c.k])f.querySelector('.chk[data-k="'+c.k+'"]').classList.add('miss')});
  }
  if(r.bad.length&&!note)errs.push('Isi catatan untuk temuan di luar spesifikasi.');
  if(errs.length){
    const box=$('#formErr');box.textContent=errs.join(' ');box.hidden=false;box.scrollIntoView({block:'center',behavior:'smooth'});return;
  }

  const yy=String(now.getFullYear()).slice(2)+pad(now.getMonth()+1)+pad(now.getDate());
  const doc={id,no:P.code+'-'+yy+'-'+pad(now.getHours())+pad(now.getMinutes())+pad(now.getSeconds()),proc:pid,createdAt:now.toISOString(),
    shift:f.shift.value,wo,product,customer:f.customer.value.trim(),machine:f.machine?f.machine.value.trim():'',batch:f.batch?f.batch.value.trim():'',
    operatorId:me.id,operatorName:me.name,vals:d.vals,targets:d.targets,checks:d.checks,note,
    auto:r.bad.length?'ng':'ok',disp:f.disp?f.disp.value:'lulus',verified:null};
  if(P.dry){const anyNg=ag.rolls.some(k=>k.s==='ng');doc.inspector=insp;doc.kts=kts;doc.defect=defect;doc.auto=anyNg?'ng':'ok';doc.disp=anyNg?'hold':'lulus'}
  if(ag)Object.assign(doc,{komposisi:ag.komposisi,agingDays:ag.agingDays,agingIn:ag.agingIn,rolls:ag.rolls});

  if(ok){afterSave(doc,did)}
}

function filteredReports(){
  const f=S.filters,q=f.q.trim().toLowerCase();
  let cut=0;
  let mFrom=0,mTo=0;
  if(f.range==='today')cut=startOfDay(new Date()).getTime();
  else if(/^m:\d{4}-\d{2}$/.test(f.range)){const y=+f.range.slice(2,6),m=+f.range.slice(7)-1;mFrom=new Date(y,m,1).getTime();mTo=new Date(y,m+1,1).getTime()}
  else if(f.range!=='all')cut=Date.now()-Number(f.range)*86400000;
  return visibleReports().filter(r=>{
    if(f.proc!=='all'&&grpOf(r)!==f.proc)return false;
    if(f.disp==='tindakan'){if(!(r.qn>0&&!r.tindakan))return false}
    else if(f.disp!=='all'&&r.disp!==f.disp)return false;
    if(cut&&new Date(r.createdAt).getTime()<cut)return false;
    if(mFrom){const t=new Date(r.createdAt).getTime();if(t<mFrom||t>=mTo)return false}
    if(q){const hay=[r.wo,r.product,r.customer,r.machine,r.batch,r.operatorName,r.op,r.defect,r.size,r.qcNote&&r.qcNote.text].join(' ').toLowerCase();if(!hay.includes(q))return false}
    return true;
  });
}

/* ================= TOLAKAN ================= */
function tFiltered(){
  const f=S.tf,q=f.q.trim().toLowerCase();
  const mb=monthBounds(f.range);let cut=0;
  if(!mb&&f.range==='today')cut=startOfDay(new Date()).getTime();
  else if(!mb&&f.range!=='all'&&!isNaN(Number(f.range)))cut=Date.now()-Number(f.range)*86400000;
  return tolakanItems().filter(r=>{
    if(!isTolakan(r))return false;
    if(f.proc!=='all'&&grpOf(r)!==f.proc)return false;
    if(f.st!=='all'&&tolakanState(r)!==f.st)return false;
    if(mb){const t=new Date(r.createdAt).getTime();if(t<mb[0]||t>=mb[1])return false}
    if(cut&&new Date(r.createdAt).getTime()<cut)return false;
    if(q){const hay=[r.wo,r.product,r.customer,r.machine,r.operatorName,r.defect,r.size,r.no].join(' ').toLowerCase();if(!hay.includes(q))return false}
    return true;
  });
}

function schedGroups(){

async function putSortir(r,mut){
  const cur=findItem(r.id)||r,me=getMe(),now=new Date().toISOString();
  const doc=Object.assign({},cur);const log=sortLog(cur).slice();
  const out=mut(doc,log,now,me);if(out===false)return false;
  doc.sortirLog=log;
  const sm=sortSum(doc),old=cur.sortir||{};let st=old.status||'belum';
  if(doc.__forceSt){st=doc.__forceSt;delete doc.__forceSt}
  else if(st!=='selesai'||!((doc.qn||0)?sm.done>=doc.qn:true))st=sm.done>0?'proses':'belum';
  if(st==='selesai'&&!old.finishedAt&&!doc.sortir)doc.sortir=old;
  doc.sortir={status:st,done:sm.done,by:me.id,name:me.name,at:now,startedAt:old.startedAt||(sm.done>0?now:null),finishedAt:st==='selesai'?(old.finishedAt||now):null};
  return putItemDoc(doc);
}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  if(act==='scrim'){if(e.target===el)closeModal();return}
  switch(act){
    case 'dmon':{const d=+el.dataset.d,dm=dmGet(),t=new Date(dm.y,dm.m+d,1),n=new Date();if(t>new Date(n.getFullYear(),n.getMonth(),1))break;S.dm={y:t.getFullYear(),m:t.getMonth()};render();break}
    case 'pinshow':{const i=$('#'+el.dataset.for);if(i){const show=i.type==='password';i.type=show?'text':'password';el.setAttribute('aria-label',show?'Sembunyikan PIN':'Tampilkan PIN')}break}
    case 'nav':if(S.view==='form'){captureDraft();saveDrafts()}S.view=el.dataset.v;S.confirmDraft=null;render();window.scrollTo(0,0);break;
    case 'newform':{
      if(!canCreate())break;
      if(S.view==='form')captureDraft();
      if(visibleDrafts().length>=MAXDRAFT){toast('Maksimal '+MAXDRAFT+' laporan sekaligus. Simpan atau buang salah satu dulu.',true);break}
      newDraft(el.dataset.p);S.view='form';saveDrafts();render();window.scrollTo(0,0);break}
    case 'editreport':{
      const r=S.reports.find(x=>x.id===id);if(!r||!canEditReport(r))break;
      if(S.view==='form')captureDraft();
      S.detailId=null;S.confirmDel=null;renderModal();
      const ex=S.drafts.find(d=>d.editId===id);
      if(ex){openDraft(ex.id);break}
      if(visibleDrafts().length>=MAXDRAFT){toast('Maksimal '+MAXDRAFT+' laporan sekaligus. Simpan atau buang salah satu dulu.',true);break}
      const d=newDraft(r.proc,reportToFormData(r));
      d.editId=r.id;d.editNo=r.wo;d.base=(r.edits||[]).length;
      d.touched=PROC[r.proc].kind==='log'?{kts:true,disp:false}:{disp:r.disp!==(r.auto==='ng'?'hold':'lulus'),kts:false};
      S.view='form';saveDrafts();render();window.scrollTo(0,0);break}
    case 'draftgo':openDraft(id);break;
    case 'draftx':askDiscard(id);break;
    case 'draftadd':if(S.view==='form'){captureDraft();saveDrafts()}S.view='new';S.confirmDraft=null;render();window.scrollTo(0,0);break;
    case 'draftdup':{
      const d=curDraft();if(!d)break;
      captureDraft();
      if(visibleDrafts().length>=MAXDRAFT){toast('Maksimal '+MAXDRAFT+' laporan sekaligus. Simpan atau buang salah satu dulu.',true);break}
      const seed={};['date','shift','wo','product','customer','size'].forEach(k=>{if(d.data&&d.data[k]!=null&&d.data[k]!=='')seed[k]=d.data[k]});
      newDraft(d.proc,seed);S.view='form';saveDrafts();render();window.scrollTo(0,0);toast('Data produk disalin ke laporan baru');break}
    case 'cancelform':askDiscard(S.activeDraft);break;
    case 'logout':if(S.view==='form'){captureDraft();saveDrafts()}logout();break;
    case 'open':{S.detailId=id;S.confirmDel=null;renderModal();
      const r0=S.reports.find(x=>x.id===id),me0=getMe();
      if(r0&&me0&&noteUnread(r0,me0.id))safe(()=>put('memoReads',{id:noteSeenId(r0,me0.id),kind:'note',reportId:id,userId:me0.id,at:new Date().toISOString()})).then(()=>updateChrome());
      break}
    case 'closemodal':closeModal();break;
    case 'addroll':{captureDraft();const d=curDraft();if(!d)break;const n=rollCount(d);d.rollN=n+1;const prev=d.data['rm_'+(n-1)];if(prev&&!d.data['rm_'+n])d.data['rm_'+n]=prev;saveDrafts();S.domDraft=null;render();break}
    case 'delroll':{captureDraft();const d=curDraft(),i=+el.dataset.i;if(!d)break;const n=rollCount(d),ps=['rn','rm','rs','ri','rd','rt'];
      if(n<=1){ps.forEach(q=>delete d.data[q+'_0'])}
      else{for(let k=i;k<n-1;k++)ps.forEach(q=>{const v=d.data[q+'_'+(k+1)];if(v===undefined)delete d.data[q+'_'+k];else d.data[q+'_'+k]=v});ps.forEach(q=>delete d.data[q+'_'+(n-1)]);d.rollN=n-1}
      saveDrafts();S.domDraft=null;render();break}
    case 'agopen':{if(e.target.closest('input,label'))break;S.agingSel=[el.dataset.key];S.modal='aging';renderModal();break}
    case 'agview':S.ag.view=el.dataset.v;render();break;
    case 'agopenrep':{const wk=(el.dataset.keys||'').split(',');const ks=agingItems().filter(x=>x.r.id===id&&x.st==='due'&&wk.includes(x.key)).map(x=>x.key);if(ks.length){S.agingSel=ks;S.modal='aging';renderModal()}else{S.detailId=id;S.confirmDel=null;renderModal()}break}
    case 'agbulk':{if(!S.agPick.length)break;S.agingSel=S.agPick.slice();S.modal='aging';renderModal();break}
    case 'agexport':exportAging();break;
    case 'sdel':S.confirmSdel=el.dataset.eid;renderModal();break;
    case 'sdelno':S.confirmSdel=null;renderModal();break;
    case 'sdelyes':{const r=findItem(id);S.confirmSdel=null;if(!r||!canSortir(r))break;const eid=el.dataset.eid;
      const ok=await putSortir(r,(doc,log)=>{const i=log.findIndex(e=>e.id===eid);if(i<0)return false;log.splice(i,1)});
      if(ok){toast('Input sortir dihapus');renderModal();updateChrome()}break}
    case 'sfinish':{const r=findItem(id);if(!r||!canSortir(r))break;if(await putSortir(r,doc=>{doc.__forceSt='selesai'})){toast('Sortir ditandai selesai');renderModal();updateChrome()}break}
    case 'sreopen':{const r=findItem(id);if(!r||!canSortir(r))break;if(await putSortir(r,doc=>{doc.__forceSt=sortSum(doc).done>0?'proses':'belum'})){toast('Sortir dibuka lagi');renderModal();updateChrome()}break}
    case 'copy':{const r=S.reports.find(x=>x.id===id);if(r)copyText(summaryText(r));break}
    case 'del':S.confirmDel=id;renderModal();break;
    case 'delno':S.confirmDel=null;renderModal();break;
    case 'delyes':{
      const r=S.reports.find(x=>x.id===id),me=getMe();if(!r||!canDeleteReport(r))break;
      const ta=$('#delReason'),reason=ta?ta.value.trim():'';
      if(!reason){toast('Isi alasan penghapusan dulu.',true);if(ta)ta.focus();break}
      const e={at:new Date().toISOString(),by:me.id,name:me.name,role:me.role,reason};
      const ok=await safe(()=>put('reports',Object.assign({},r,{del:e,delLog:(r.delLog||[]).concat(e)})));
      if(ok){toast('Laporan dihapus. Tercatat di Riwayat Hapus.');S.detailId=null;S.confirmDel=null;renderModal();render()}
      break}
    case 'delrestore':{
      const r=S.delReps.find(x=>x.id===id),me=getMe();if(!r||!isSpv())break;
      const log=(r.delLog||[]).slice();
      if(log.length)log[log.length-1]=Object.assign({},log[log.length-1],{restoredAt:new Date().toISOString(),restoredBy:me.name,restoredById:me.id});
      const ok=await safe(()=>put('reports',Object.assign({},r,{del:null,delLog:log})));
      if(ok)toast('Laporan dipulihkan');
      break}
    case 'export':exportCsv();break;
    case 'openmemo':{
      S.memoId=id;S.detailId=null;S.confirmDel=null;renderModal();
      const m=S.memos.find(x=>x.id===id),me=getMe();
      if(m&&!isSpv()&&(m.toIds||[]).includes(me.id)&&!isRead(m,me.id))safe(()=>put('memoReads',{id:id+'_'+me.id,memoId:id,userId:me.id,at:new Date().toISOString()}));
      break}
    case 'memonew':S.modal='memo';S.confirmDel=null;renderModal();break;
    case 'memosel':{
      const g=el.dataset.g;
      $$('input[name="to"]').forEach(c=>{c.checked=g==='all'?true:g==='none'?false:(c.dataset.g||'').split(' ').includes(g)?true:c.checked});
      break}
    case 'memodel':S.confirmDel=id;renderModal();break;
    case 'memodelyes':{
      const ok=await safe(async()=>{for(const x of S.memoReads.filter(x=>x.memoId===id))await remove('memoReads',x.id);await remove('memos',id)});
      if(ok){toast('Memorandum dihapus');S.memoId=null;S.confirmDel=null;renderModal();render()}
      break}
    case 'useredit':{
      S.userEdit=id==='new'?{}:Object.assign({},S.users.find(x=>x.id===id));S.confirmDel=null;S.modal='user';renderModal();break}
    case 'userdel':S.confirmDel=id;renderModal();break;
    case 'userdelyes':{
      const admins=S.users.filter(x=>x.role==='admin');
      const t=S.users.find(x=>x.id===id);
      if(t&&t.role==='admin'&&admins.length<=1){showErr('userErr','Tidak bisa menghapus admin terakhir.');break}
      const ok=await safe(()=>remove('users',id));
      if(ok){toast('Akun dihapus');S.modal=null;S.userEdit=null;S.confirmDel=null;renderModal();render()}
      break}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&(S.detailId||S.modal||S.memoId)){closeModal();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr[data-act]')){e.preventDefault();e.target.click()}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  const k=f.dataset.form;
  if(k==='login')doLogin(f);
  else if(k==='setup')doSetup(f);
  else if(k==='report')submitReport(f);
  else if(k==='user')submitUser(f);
  else if(k==='tindakan')submitTindakan(f);
  else if(k==='sortirin')submitSortirIn(f);
  else if(k==='qcnote')submitQcNote(f);
  else if(k==='aging')submitAging(f);
  else if(k==='memo')submitMemo(f);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.filter==='q'){S.filters.q=t.value;$('#results').innerHTML=resultsHTML();return}
  if(t.dataset&&t.dataset.ag==='q'){S.ag.q=t.value;$('#agresults').innerHTML=agResultsHTML();return}
  if(t.dataset&&t.dataset.sf==='q'){S.sf.q=t.value;$('#sresults').innerHTML=sResultsHTML();return}
  if(t.dataset&&t.dataset.tf==='q'){S.tf.q=t.value;$('#tresults').innerHTML=tResultsHTML();return}
  if(t.closest&&t.closest('#rform')){updateForm();queueSave()}
  const sf=t.closest&&t.closest('form[data-form=tindakan],form[data-form=qcnote]');if(sf)syncSave(sf);
});
document.addEventListener('change',e=>{
  {const sf=e.target.closest&&e.target.closest('form[data-form=tindakan],form[data-form=qcnote]');if(sf)syncSave(sf)}
  const t=e.target;
  if(t.dataset&&t.dataset.filter&&t.dataset.filter!=='q'){S.filters[t.dataset.filter]=t.value;$('#results').innerHTML=resultsHTML();return}
  if(t.dataset&&t.dataset.agpick){const k=t.dataset.agpick;S.agPick=t.checked?Array.from(new Set(S.agPick.concat([k]))):S.agPick.filter(x=>x!==k);$('#agresults').innerHTML=agResultsHTML();return}
  if(t.dataset&&t.dataset.ag&&t.dataset.ag!=='q'){S.ag[t.dataset.ag]=t.value;$('#agresults').innerHTML=agResultsHTML();const c=$('#agcount');if(c)c.textContent=agCountTxt();return}
  if(t.dataset&&t.dataset.sf&&t.dataset.sf!=='q'){S.sf[t.dataset.sf]=t.value;$('#sresults').innerHTML=sResultsHTML();const c=$('#scount');if(c)c.textContent=sFiltered().length+' laporan';return}
  if(t.dataset&&t.dataset.tf&&t.dataset.tf!=='q'){S.tf[t.dataset.tf]=t.value;$('#tresults').innerHTML=tResultsHTML();return}
  if(t.closest&&t.closest('#rform')){
    if(t.name==='disp')S.dispTouched=true;
    if(t.name==='kts')S.ktsTouched=true;
    updateForm();queueSave();return;
  }
  if(t.matches&&t.matches('select[data-role]')){
    const adm=t.value!=='operator';
    $('#procBox').hidden=adm;$('#admNote').hidden=!adm;$('#admNote').textContent=roleNote(t.value);
  }
});

window.addEventListener('pagehide',()=>{if(S.view==='form'){captureDraft();saveDrafts()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.view==='form'){captureDraft();saveDrafts()}});
init();
})();
</script>
</body></html>
